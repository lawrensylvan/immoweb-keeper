scalar Date

type Query {

    estates(
        immowebCode:        Int
        priceRange:         [Int]
        zipCodes:           [Int]
        propertyTypes:      [PropertyType!]
        onlyWithGarden:     Boolean
        minGardenArea:      Int
        minLivingArea:      Int
        minBedroomCount:    Int
        freeText:           String
        onlyStillAvailable: Boolean
        onlyLiked:          Boolean
        onlyVisited:        Boolean

        orderBy:            OrderByInput
        offset:             Int
        limit:              Int
    ): EstateList

    estatesNear(
        location:       [Float]
        distanceMeters: Int

        immowebCode:        Int
        priceRange:         [Int]
        zipCodes:           [Int]
        propertyTypes:      [PropertyType!]
        onlyWithGarden:     Boolean
        minGardenArea:      Int
        minLivingArea:      Int
        minBedroomCount:    Int
        freeText:           String
        onlyStillAvailable: Boolean
        onlyLiked:          Boolean
        onlyVisited:        Boolean
    ): [Estate]

    estateByImmowebCode(
        immowebCode: Int
    ): Estate

    users: [User]

    userByName(
        name: String
    ): User

    localities: [Locality]

    routineStatus: RoutineStatus
    postalCodes: [PostalCode!]!
    routineRuns(limit: Int, postalCode: Int, propertyType: PropertyType): [RoutineRun]
    routineHistory(postalCode: Int!, propertyType: PropertyType!): [RoutineHistoryDay!]!
    
}

input OrderByInput {
  field: String
  order: SortOrder
}

enum SortOrder {
  ascend
  descend
  none
}

type EstateList {
    page:       [Estate]
    totalCount: Int
}

type Estate {
    
    immowebCode:        Int!

    description:        String
    images:             [String]

    price:              Int
    priceHistory:       [PriceHistory]

    geolocation:        [Float]
    zipCode:            Int
    propertyType:       PropertyType
    locality:           String
    street:             String
    streetNumber:       String
    
    bedroomCount:       Int
    hasGarden:          Boolean
    gardenArea:         Int
    livingArea:         Int

    creationDate:       Date!
    modificationDate:   Date!
    disappearanceDate:  Date    

    isAuction:          Boolean
    isSold:             Boolean
    isUnderOption:      Boolean

    agencyName:         String
    agencyLogo:         String    
    
    isLiked:            Boolean
    isVisited:          Boolean
}

type PriceHistory {
    date:   Date!
    price:  Int
}

type User {
    name:           String!
    likedEstates:   [Estate]
    visitedEstates: [Estate]
}

type Locality {
    zipCode: Int
    name: String
}

type RoutineSchedule {
    enabled:        Boolean!
    cronExpression: String!
    timezone:       String!
    nextRunAt:      Date
    postalCodes:    [Int!]!
    propertyTypes:  [PropertyType!]!
}

enum PropertyType { HOUSE APARTMENT }

type PostalCode {
    code: Int!
    localities: [String!]!
    group: String!
    groupName: String!
}

type RoutineRun {
    id:           ID!
    trigger:      String!
    status:       String!
    startedAt:    Date!
    finishedAt:   Date
    errorSummary: String
    requestedPostalCodes: [Int!]!
    requestedPropertyTypes: [PropertyType!]!
    coverage: [RoutineCoverage!]!
    totals:       RoutineRunTotals
}

type RoutineCoverage {
    postalCode: Int!
    propertyType: PropertyType!
    status: String!
    added: Int
    updated: Int
    disappeared: Int
    errorSummary: String
}

type RoutineRunTotals {
    added:                Int
    updated:              Int
    disappeared:          Int
    disappearanceChecked: Boolean
}

type RoutineStatus {
    schedule:          RoutineSchedule!
    activeRun:         RoutineRun
    lastRun:           RoutineRun
    lastSuccessfulRun: RoutineRun
}

type RoutineHistoryDay {
    date: String!
    runId: ID!
}

input RoutineScheduleInput {
    enabled:        Boolean
    cronExpression: String
    postalCodes:    [Int!]
    propertyTypes:  [PropertyType!]
}

type RoutineTriggerResult {
    started: Boolean!
    run:     RoutineRun
}

type Mutation {

    register(name: String!, password: String!): User
    login(name: String!, password: String!): String

    markAsLiked(
        immowebCode: Int!
        isLiked: Boolean
    ): Boolean

    markAsVisited(
        immowebCode: Int!
        isVisited: Boolean
    ): Boolean

    updateRoutineSchedule(input: RoutineScheduleInput!): RoutineSchedule
    triggerRoutine: RoutineTriggerResult!

}
